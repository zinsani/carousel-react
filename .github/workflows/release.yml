name: Release

on:
  push:
    branches:
      - main

# Never run two releases at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit / create the GitHub Release
      pull-requests: write # open the "Version Packages" PR
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than the npm
      # bundled with Node 22.
      - name: Use an npm with OIDC support
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build:lib

      # With changesets pending, this opens/updates a "Version Packages" PR.
      # Once that PR is merged there are no changesets left, so this instead
      # publishes to npm and creates the matching GitHub Release.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
